# CI do Estoque Sebratel: portão de validação, não faz deploy (modelo A: o Portainer builda do Git).
# O check obrigatório da proteção de branch é só o `ci-ok`, que agrega todos os jobs.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

# Push novo cancela o run anterior da mesma branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicacao:
    name: Aplicação — typecheck, testes, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'          # o mesmo da imagem Docker (node:24-alpine)
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Instalar dependências (server e web)
        run: npm run install:all

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  imagem:
    name: Imagem Docker + smoke da stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Variáveis fictícias. Sem credencial do Voalle/MariaDB o servidor sobe sem banco: as fontes
      # falham e o health continua UP. A imagem roda com NODE_ENV=production, e nele o servidor se
      # recusa a subir com login ligado sem GOOGLE_CLIENT_ID: um ID fictício mantém o login ligado,
      # como em produção (o health é público, nenhuma rota de dados é chamada).
      GOOGLE_CLIENT_ID: ci-smoke.apps.googleusercontent.com
      ADMIN_EMAILS: ci-smoke@sebratel.com.br
    steps:
      - uses: actions/checkout@v4

      # O mesmo Dockerfile e os mesmos build args que o Portainer usa
      - name: Construir a imagem
        run: docker compose -f docker-compose.portainer.yml build

      # --wait espera o healthcheck do compose, o mesmo critério que o Portainer usa
      - name: Subir a stack
        run: docker compose -f docker-compose.portainer.yml up -d --wait --wait-timeout 300

      - name: Health responde UP com a versão do package.json
        run: |
          esperada=$(jq -r '.version' package.json)
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:3012/api/v1/health -o health.json
          status=$(jq -r '.data.status' health.json)
          versao=$(jq -r '.data.version' health.json)
          if [ "$status" != "UP" ] || [ "$versao" != "$esperada" ]; then
            echo "::error::/api/v1/health devolveu status=$status version=$versao (esperado UP e $esperada):"
            cat health.json; exit 1
          fi
          # a tag e o label da imagem são o que o Portainer mostra
          label=$(docker image inspect "logistic-dashboard:$esperada" \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          if [ "$label" != "$esperada" ]; then
            echo "::error::imagem logistic-dashboard:$esperada com label de versão '$label' (esperado $esperada)."; exit 1
          fi
          echo "Health OK: status=$status version=$versao; imagem logistic-dashboard:$esperada"

      - name: Logs da stack
        if: failure()
        run: docker compose -f docker-compose.portainer.yml logs --no-color --timestamps > compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Derrubar a stack
        if: always()
        run: docker compose -f docker-compose.portainer.yml down -v

  validacoes:
    name: Validações — versão e compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # a versão é comparada com a da branch-alvo / do commit anterior

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Versão X.Y.Z igual no package.json, nos package-lock.json e no compose, e MAIOR que a do
      # ambiente: no PR, a da branch-alvo (origin/main ou origin/staging); no push, a do commit anterior.
      - name: Versão
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python .github/scripts/validate-version.py

      - name: Instalar PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml

      # Nome da stack, nomes de serviço, gateway por ambiente e faixa de portas. O mesmo arquivo sobe
      # em staging e em produção, então ele é validado para os dois ambientes.
      - name: Compose
        run: |
          for ambiente in staging production; do
            python .github/scripts/validate-compose.py \
              --repo dev_ReactJS_logisticDashboard \
              --env "$ambiente" \
              --strict-ports \
              --exceptions .github/compose-exceptions.txt \
              docker-compose.portainer.yml
          done

  # Check único para a proteção de branch (main e staging). `if: always()`, senão ele é pulado quando
  # um `needs` falha e o check nunca reporta. Job novo entra no `needs`, sem mexer na regra do GitHub.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [aplicacao, imagem, validacoes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          echo "aplicacao=${{ needs.aplicacao.result }} imagem=${{ needs.imagem.result }} validacoes=${{ needs.validacoes.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job não passou."; exit 1
          fi
          echo "Tudo verde."
