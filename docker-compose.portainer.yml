# Stack do Portainer (modelo A do padrão de deploy: o Portainer builda a imagem a partir do Git).
# Staging: branch `staging`; produção: branch `main`. Mesmo arquivo nos dois, com o
# Environment de cada stack (segredos e cadência) no painel do Portainer.
name: dev_reactjs_logisticdashboard   # = nome do repositório em minúsculas = nome da stack no Portainer

services:
  # papel: a SPA e a API dela num contêiner só (o NPM aponta para cá).
  # Sem container_name: o Compose nomeia <stack>-frontend-1.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.1.0}
    # a versão vai na tag da imagem: o Portainer mostra qual versão está no ar
    image: logistic-dashboard:${APP_VERSION:-1.1.0}
    # a imagem é construída aqui, não baixada de registro: sem isto o "Re-pull
    # image" do Portainer tenta o Docker Hub e o redeploy falha
    pull_policy: build
    labels:
      org.opencontainers.image.version: ${APP_VERSION:-1.1.0}
    restart: unless-stopped
    # Frontend / Web UI (3000–3099): 3012 em staging e em produção (planilha de portas)
    ports:
      - "${FRONTEND_PORT:-3012}:8080"
    # ~1,1 GB medidos no pico da carga (10/11/2026); o heap do Node fica em ~70% do limite
    mem_limit: ${MEM_LIMIT:-3g}
    memswap_limit: ${MEM_LIMIT:-3g}
    environment:
      TZ: America/Sao_Paulo
      PORT: 8080
      # atrás do proxy reverso: 1 salto (o rate limit precisa do IP real)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}

      # ---- Voalle (PostgreSQL) — no Power BI era o DSN "dbVoalle" ----
      DB_VOALLE_HOST: ${DB_VOALLE_HOST}
      DB_VOALLE_DATABASE: ${DB_VOALLE_DATABASE}
      DB_VOALLE_USER: ${DB_VOALLE_USER}
      DB_VOALLE_PASSWORD: ${DB_VOALLE_PASSWORD}
      DB_VOALLE_PORT: ${DB_VOALLE_PORT:-5432}

      # ---- MariaDB (base Senior) — no Power BI era o DSN "dbMaria" ----
      DB_MARIA_HOST: ${DB_MARIA_HOST}
      DB_MARIA_USER: ${DB_MARIA_USER}
      DB_MARIA_PASSWORD: ${DB_MARIA_PASSWORD}
      DB_MARIA_PORT: ${DB_MARIA_PORT:-3306}

      # ---- dados do app (controle de estoque, usuários, log) — no volume abaixo ----
      DATA_PATH: /app/data

      # ---- login com Google ----
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-sebratel.com.br}
      # admin(s) de fábrica: só valem enquanto não houver nenhum admin salvo
      # (instalação nova); depois, permissões são dadas na tela de Administração
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # ---- cadência (em staging, mais espaçada: ver README, "Deploy") ----
      REFRESH_INTERVAL_MS: ${REFRESH_INTERVAL_MS:-3600000}
      # tela de Compras: saldo de itens e pedidos relidos a cada minuto (~1 s de consulta)
      LIVE_REFRESH_INTERVAL_MS: ${LIVE_REFRESH_INTERVAL_MS:-60000}
      # tela do laboratório: as duas consultas (~53 s e ~28 s) relidas a cada 3 horas
      LAB_REFRESH_INTERVAL_MS: ${LAB_REFRESH_INTERVAL_MS:-10800000}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-900000}
    volumes:
      # controle de estoque, usuários/permissões e log de edições: sem volume,
      # cada deploy apagaria tudo (e o cadastro voltaria à planilha oficial)
      - logistic-dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logistic-dashboard-data:
